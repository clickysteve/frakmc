# Test, build and deploy FrakMC to GitHub Pages (static site; no server, no keys).
# Runs when pushed to main, or by hand from the Actions tab. Any failure stops the deploy.
name: Deploy FrakMC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build for GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ -s CNAME || "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          npx vite build --base="$BASE"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
